<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Meridian</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="22%" r="75%">
      <stop offset="0" stop-color="#1B2230"/>
      <stop offset="0.55" stop-color="#0E1014"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </radialGradient>
    <linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="222" y1="160" x2="802" y2="864">
      <stop offset="0" stop-color="#F6C27A"/>
      <stop offset="0.5" stop-color="#E59A38"/>
      <stop offset="1" stop-color="#B8701E"/>
    </linearGradient>
    <clipPath id="globe">
      <circle cx="512" cy="512" r="290"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>

  <!-- longitude ellipse -->
  <ellipse cx="512" cy="512" rx="128" ry="290" fill="none" stroke="#ECEEF1" stroke-opacity="0.72" stroke-width="22"/>

  <!-- horizon / peg line -->
  <line x1="222" y1="512" x2="802" y2="512" stroke="#9FC2FF" stroke-width="20" clip-path="url(#globe)"/>

  <!-- globe ring and meridian -->
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#copper)" stroke-width="40"/>
  <line x1="512" y1="160" x2="512" y2="864" stroke="url(#copper)" stroke-width="40" stroke-linecap="round"/>
</svg>
